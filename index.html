<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRU Glasses</title>
<style>
  /* Importing the exact fonts */
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&family=Hepta+Slab:wght@200;300&family=Danfo&display=swap');

  /* Reset and base styles */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  /* Base Theme Variables (Light Mode / Vector Edition) */
  :root {
    --bg-color: #FFFFFF;
    --text-color: #2b2b2b;
    --headline-color: #555;
    --cursor-color: #555;
    --image-blend: multiply;
    --image-bg: #FFFFFF;
    --logo-bg: #D95F02; /* Original Orange */
  }

  /* Dark Mode Overrides (Sauna Edition) */
  body.dark-mode {
    --bg-color: #000000;
    --text-color: #FFFFFF;
    --headline-color: #FFFFFF;
    --cursor-color: #FFFFFF;
    --image-blend: normal; 
    --image-bg: transparent;
    --logo-bg: #829356; /* Olive Green */
  }

  html, body {
    height: 100%;
    background-color: var(--bg-color) !important; 
    font-family: 'Poppins', sans-serif;
    overflow: hidden; 
    transition: background-color 0.4s ease;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    width: 100vw;
    color: var(--text-color);
    transition: color 0.4s ease;
  }

  /* 1. Navigation Bar */
  nav {
    display: flex;
    justify-content: center;
    gap: clamp(15px, 3vw, 40px); 
    margin-top: 6vh; 
    width: 100%;
    font-size: clamp(12px, 1.5vw, 16px);
    font-weight: 400;
  }

  nav a {
    color: var(--text-color);
    text-decoration: none;
    cursor: pointer;
    transition: opacity 0.2s, color 0.4s ease;
  }

  nav a:hover {
    opacity: 0.6;
  }

  /* 2. Headline */
  h1 {
    font-family: 'Hepta Slab', serif;
    font-weight: 200;
    font-size: clamp(24px, 4vh, 48px);
    color: var(--headline-color);
    margin-top: 12vh; 
    margin-bottom: 6vh;
    text-align: center;
    line-height: 1.2;
    min-height: 1.2em; 
    transition: color 0.4s ease;
  }

  h1 .caps {
    letter-spacing: 0.15em;
  }

  /* Blinking Cursor Animation */
  .cursor {
    display: inline-block;
    width: 3px;
    height: 0.9em;
    background-color: var(--cursor-color);
    margin-left: 4px;
    animation: blink 0.8s step-end infinite;
    vertical-align: middle;
    transition: background-color 0.4s ease;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .cursor.done {
    animation: none;
    opacity: 0;
    transition: opacity 0.5s;
  }

  /* 3. Product Image */
  .product-image-container {
    flex-grow: 1; 
    min-height: 0; 
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    max-width: 720px; 
    margin-bottom: 4vh;
    background-color: var(--image-bg);
    transition: background-color 0.4s ease;
  }

  .product-image-container img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
    background-color: var(--image-bg);
    mix-blend-mode: var(--image-blend); 
    transition: opacity 0.3s ease; 
  }

  /* 4. BRU Logo Badge */
  .logo-badge {
    background-color: var(--logo-bg); 
    color: #FFFFFF;
    font-family: 'Danfo', 'Rockwell Extra Bold', serif;
    font-weight: 900;
    font-variation-settings: 'wght' 900, 'wdth' 100;
    font-size: clamp(40px, 6vh, 64px);
    padding: 12px 36px;
    letter-spacing: -0.05em; 
    line-height: 1; 
    border-radius: 0; 
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 6vh; 
    transition: background-color 0.4s ease; 
  }
</style>
</head>
<body>

  <!-- Navigation Menu -->
  <nav>
    <a href="https://github.com/suyashxvz" target="_blank">Support</a>
    <a href="#" id="vector-toggle">Vector Edition</a>
    <a href="#">Cart</a>
    <a href="#">Search</a>
    <a href="#">Profile</a>
    <a href="#" id="sauna-toggle">Sauna Edition</a>
    <a href="#">Customize</a>
  </nav>

  <!-- Headline Container for Typewriter -->
  <h1><span id="text-output"></span><span class="cursor"></span></h1>

  <!-- Product Image (Updated with new light mode link) -->
  <div class="product-image-container">
    <img 
      id="product-img"
      src="https://i.ibb.co/rfG5T7hv/erasebg-transformed-6.png" 
      alt="Sunglasses Product Image"
    >
  </div>

  <!-- BRU Logo Badge -->
  <div class="logo-badge">BRU</div>

  <!-- Scripts -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const textOutput = document.getElementById("text-output");
      const cursor = document.querySelector(".cursor");
      let typingTimeout;

      // --- Dynamic Typewriter Effect ---
      function runTypewriter(text) {
        clearTimeout(typingTimeout);
        textOutput.innerHTML = ''; 
        cursor.classList.remove('done'); 
        
        let i = 0;
        
        function type() {
          if (i < text.length) {
            let char = text.charAt(i);
            
            if (i < 10) { // "SUNGLASSES" is 10 characters
              let span = textOutput.querySelector('.caps');
              if (!span) {
                span = document.createElement('span');
                span.className = 'caps';
                textOutput.appendChild(span);
              }
              span.textContent += char;
            } else {
              let textNode = textOutput.lastChild;
              if (!textNode || textNode.nodeType !== 3) { 
                textNode = document.createTextNode('');
                textOutput.appendChild(textNode);
              }
              textNode.textContent += char;
            }
            
            i++;
            typingTimeout = setTimeout(type, 80); 
          } else {
            cursor.classList.add('done');
          }
        }
        type();
      }

      // Start the initial typing effect
      runTypewriter("SUNGLASSES, Vectorized");

      // --- Theme Toggles ---
      const saunaToggle = document.getElementById('sauna-toggle');
      const vectorToggle = document.getElementById('vector-toggle');
      const productImg = document.getElementById('product-img');
      
      // Updated Light Mode Image Link
      const lightImageURL = "https://i.ibb.co/rfG5T7hv/erasebg-transformed-6.png";
      // Dark Mode Image Link
      const darkImageURL = "https://i.ibb.co/G6tdRxJ/erasebg-transformed-5.png"; 

      // Helper function to swap image smoothly
      function swapImage(newSrc) {
        productImg.style.opacity = '0'; 
        setTimeout(() => {
          productImg.src = newSrc;
          productImg.style.opacity = '1'; 
        }, 300); 
      }

      // Sauna Edition (Dark Mode + A/C off text)
      saunaToggle.addEventListener('click', (e) => {
        e.preventDefault(); 
        
        if (!document.body.classList.contains('dark-mode')) {
          document.body.classList.add('dark-mode');
          swapImage(darkImageURL);
          runTypewriter("SUNGLASSES, A/C off");
        }
      });

      // Vector Edition (Light Mode Revert + Vectorized text)
      vectorToggle.addEventListener('click', (e) => {
        e.preventDefault(); 
        
        if (document.body.classList.contains('dark-mode')) {
          document.body.classList.remove('dark-mode');
          swapImage(lightImageURL);
          runTypewriter("SUNGLASSES, Vectorized");
        }
      });
    });
  </script>
</body>
</html>
